<!DOCTYPE html>
<html>
<head>
<title>Jarvis AI Assistant</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

<h1>Jarvis – Personal AI Assistant</h1>

<div id="chatbox"></div>

<input id="userInput" placeholder="Ask anything...">
<button onclick="sendMessage()">Send</button>

<hr>

<h3>Store Knowledge</h3>
<textarea id="memoryText" placeholder="Enter info to remember"></textarea>
<button onclick="storeMemory()">Save to Memory</button>

</div>

<script>

async function sendMessage(){

    let input = document.getElementById("userInput").value;
    let chatbox = document.getElementById("chatbox");

    chatbox.innerHTML += `<p class='user'>You: ${input}</p>`;

    let res = await fetch("/chat", {
        method: "POST",
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({message: input})
    });

    let data = await res.json();

    chatbox.innerHTML += `<p class='bot'>Assistant: ${data.reply}</p>`;

    document.getElementById("userInput").value = "";
}

async function storeMemory(){

    let text = document.getElementById("memoryText").value;

    await fetch("/store", {
        method: "POST",
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({text: text})
    });

    alert("Saved to memory!");

    document.getElementById("memoryText").value = "";
}

</script>

</body>
</html>
